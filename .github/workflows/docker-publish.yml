name: Docker Build Test and Publish to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: student-result-prediction

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:ci .

      - name: Run test container
        run: |
          docker run -d --name student-result-ci -p 8000:5000 $IMAGE_NAME:ci

      - name: Test application
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://localhost:8000/; then
              echo "Application test successful"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 3
          done
          docker logs student-result-ci
          exit 1

      - name: Remove test container
        if: always()
        run: docker rm -f student-result-ci || true

      - name: Prepare GHCR image name
        run: |
          IMAGE_ID=$(echo ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag Docker image
        run: |
          docker tag $IMAGE_NAME:ci $IMAGE_ID:latest
          docker tag $IMAGE_NAME:ci $IMAGE_ID:sha-${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:sha-${{ github.sha }}
        
